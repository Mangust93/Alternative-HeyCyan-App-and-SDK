plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
}

configurations.configureEach {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

def keystorePropertiesFile = rootProject.file("keystore.properties")

def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.fersaiyan.cyanbridge"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.fersaiyan.cyanbridge"
        minSdk = 24
        targetSdk = 35
        versionCode = 3
        versionName = "1.0.2"

        // Chapter 6: optional transcription API key (do not commit secrets).
        def openAiKey = project.findProperty("OPENAI_API_KEY") ?: ""
        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey}\""

        def proMonthlySku = project.findProperty("PRO_MONTHLY_SKU") ?: "pro_monthly"
        def proYearlySku = project.findProperty("PRO_YEARLY_SKU") ?: "pro_yearly"
        def proVerifyUrl = project.findProperty("PRO_SUB_VERIFY_URL") ?: ""
        def webSubscribeUrl = project.findProperty("WEB_SUBSCRIBE_URL") ?: ""
        def webAllowedCountries = project.findProperty("WEB_SUB_ALLOWED_COUNTRIES") ?: ""
        def donationUrl = project.findProperty("DONATION_URL") ?: "https://buymeacoffee.com/"
        buildConfigField "String", "PRO_MONTHLY_SKU", "\"${proMonthlySku}\""
        buildConfigField "String", "PRO_YEARLY_SKU", "\"${proYearlySku}\""
        buildConfigField "String", "PRO_SUB_VERIFY_URL", "\"${proVerifyUrl}\""
        buildConfigField "String", "WEB_SUBSCRIBE_URL", "\"${webSubscribeUrl}\""
        buildConfigField "String", "WEB_SUB_ALLOWED_COUNTRIES", "\"${webAllowedCountries}\""
        buildConfigField "String", "DONATION_URL", "\"${donationUrl}\""

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            // Only configure signing if keystore.properties exists.
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}


dependencies {
    def localLlamaRuntimeAarPath = (
            project.findProperty("localLlamaRuntimeAarPath")
                    ?: ""
    ).toString().trim()
    def coreConnectivityVersion = project.findProperty("heycyanCoreConnectivityVersion") ?: "0.1.0-SNAPSHOT"
    implementation("com.heycyan.core:core-connectivity:${coreConnectivityVersion}")
    implementation files("libs/glasses_sdk_20250723_v01.aar")
    implementation(libs.androidx.core.ktx)
    implementation("androidx.core:core:1.15.0")
    implementation("androidx.core:core-ktx:1.15.0")

    implementation("com.google.android.material:material:1.12.0")
    implementation("com.github.getActivity:XXPermissions:20.0")
    implementation("org.greenrobot:eventbus:3.2.0")
    implementation("com.github.ForgetAll:LoadingDialog:v1.1.2")
    implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")
    implementation("com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4")
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.android.billingclient:billing-ktx:7.1.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    if (localLlamaRuntimeAarPath.isEmpty()) {
        implementation "io.github.ljcamargo:llamacpp-kotlin:0.2.0"
    } else {
        def localLlamaRuntimeAar = rootProject.file(localLlamaRuntimeAarPath)
        if (!localLlamaRuntimeAar.exists()) {
            throw new GradleException("localLlamaRuntimeAarPath points to a missing file: ${localLlamaRuntimeAar.absolutePath}")
        }
        logger.lifecycle("Using local llama runtime AAR: ${localLlamaRuntimeAar.absolutePath}")
        implementation files(localLlamaRuntimeAar)
    }

    // LiteRT runtime for local models (Google's inference engine)
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.10.0")

    // Offline transcription fallback (Moonshine; vendored module).
    // The vendored native runtime is optional in this checkout. When it is absent,
    // app code uses a compile-safe unavailable fallback instead of building :moonshine-voice.
    def moonshineCoreCmake = rootProject.file("../third_party/moonshine/core/CMakeLists.txt")
    if (moonshineCoreCmake.exists()) {
        implementation project(":moonshine-voice")
    } else {
        logger.lifecycle("Moonshine native runtime not found; skipping :moonshine-voice dependency")
    }

    // Legacy offline transcription fallback (Vosk) - kept for now until Moonshine is fully wired
    implementation "com.alphacephei:vosk-android:0.3.47"

    // Optional phone-test / debug diagnostics module.
    // Included as debugImplementation only (never in release). Toggle off with:
    //   ./gradlew :app:assembleDebug -PincludePhoneTestTools=false
    def includePhoneTestTools = providers.gradleProperty("includePhoneTestTools").orElse("true").get().toBoolean()
    if (includePhoneTestTools) {
        debugImplementation project(":phone-test-tools")
    } else {
        logger.lifecycle("includePhoneTestTools=false; skipping :phone-test-tools dependency")
    }

    // Optional debug-log diagnostics module.
    // Included as debugImplementation only (never in release). Toggle off with:
    //   ./gradlew :app:assembleDebug -PincludeDebugLogTools=false
    def includeDebugLogTools = providers.gradleProperty("includeDebugLogTools").orElse("true").get().toBoolean()
    if (includeDebugLogTools) {
        debugImplementation project(":debug-log-tools")
    } else {
        logger.lifecycle("includeDebugLogTools=false; skipping :debug-log-tools dependency")
    }

    // Optional runtime-diagnostics module (auto-installs runtime instrumentation).
    // Included as debugImplementation only (never in release). Toggle off with:
    //   ./gradlew :app:assembleDebug -PincludeRuntimeDiagnosticsTools=false
    def includeRuntimeDiagnosticsTools = providers.gradleProperty("includeRuntimeDiagnosticsTools").orElse("true").get().toBoolean()
    if (includeRuntimeDiagnosticsTools) {
        debugImplementation project(":runtime-diagnostics-tools")
    } else {
        logger.lifecycle("includeRuntimeDiagnosticsTools=false; skipping :runtime-diagnostics-tools dependency")
    }

    // Optional conversation-translation module (V1 on-device dialog translation:
    // SpeechRecognizer -> ML Kit Language ID -> ML Kit Translation -> TextToSpeech).
    // Wired as debugImplementation only (never in release): the screen is exported=true
    // for adb/manual testing and pulls in ML Kit translate model infrastructure, so it
    // stays out of release builds until it gets a real, gated in-app entry point.
    // Toggle off with:
    //   ./gradlew :app:assembleDebug -PincludeConversationTranslation=false
    def includeConversationTranslation = providers.gradleProperty("includeConversationTranslation").orElse("true").get().toBoolean()
    if (includeConversationTranslation) {
        debugImplementation project(":conversation-translation")
    } else {
        logger.lifecycle("includeConversationTranslation=false; skipping :conversation-translation dependency")
    }

    // Optional headset/glasses button diagnostic module. Captures real key +
    // media-button events so a tester can confirm whether glasses/headset button
    // presses reach Android. Purely diagnostic: binds nothing to translation and does
    // not touch :conversation-translation.
    // Included as debugImplementation only (never in release). Toggle off with:
    //   ./gradlew :app:assembleDebug -PincludeHeadsetButtonTools=false
    def includeHeadsetButtonTools = providers.gradleProperty("includeHeadsetButtonTools").orElse("true").get().toBoolean()
    if (includeHeadsetButtonTools) {
        debugImplementation project(":headset-button-tools")
    } else {
        logger.lifecycle("includeHeadsetButtonTools=false; skipping :headset-button-tools dependency")
    }

    // Chapter 2 storage
    def room_version = "2.7.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation "androidx.room:room-testing:$room_version"

    // Chapter 4 UI gating test (androidTest)
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
